<style>
/* Layout: sticky top bar on desktop, bottom tab bar on phones. Dark-first: near-black ground with a faint red bias, graphite cards, dragon red as the single accent. */
:root{--bg:#0e0f11;--card:#17181b;--ink:#ecece9;--mute:#9a9ca3;--line:#27282d;--soft:#202125;
--acc:#e0975c;--acc-ink:#1a1008;--acc-soft:#33231a;--acc-mid:#7b4b2b;
--ok:#5fd08a;--ok-soft:#143020;--warn:#e8bd4f;--warn-soft:#352b0e;--bad:#f08585;--bad-soft:#3a1b1b;
--shadow:0 1px 2px rgb(0 0 0/.45),0 10px 24px -12px rgb(0 0 0/.7);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2ef;--card:#ffffff;--ink:#1a1b1e;--mute:#6b6d74;--line:#e3e3de;--soft:#ebebe7;
--acc:#b4622a;--acc-ink:#ffffff;--acc-soft:#f6e6d8;--acc-mid:#e6bd9b;
--ok:#15803d;--ok-soft:#dcf1e3;--warn:#946200;--warn-soft:#faedc4;--bad:#b91c1c;--bad-soft:#fbe1e1;
--shadow:0 1px 2px rgb(20 10 10/.05),0 6px 18px -8px rgb(20 10 10/.15);color-scheme:light}}
:root[data-theme="light"]{--bg:#f2f2ef;--card:#ffffff;--ink:#1a1b1e;--mute:#6b6d74;--line:#e3e3de;--soft:#ebebe7;
--acc:#b4622a;--acc-ink:#ffffff;--acc-soft:#f6e6d8;--acc-mid:#e6bd9b;
--ok:#15803d;--ok-soft:#dcf1e3;--warn:#946200;--warn-soft:#faedc4;--bad:#b91c1c;--bad-soft:#fbe1e1;
--shadow:0 1px 2px rgb(20 10 10/.05),0 6px 18px -8px rgb(20 10 10/.15);color-scheme:light}
html{scroll-padding-top:4.5rem}body{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden}
h1,h2,h3{text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
*:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:800;font-size:30px;letter-spacing:.08em;line-height:1;font-style:italic}
.logo b{color:var(--acc)}
.dnav button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mute);cursor:pointer}
.dnav button:hover{color:var(--ink)}
.dnav button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc);border-radius:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--acc)}
@media(min-width:768px){.tabs{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn-acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn-acc:hover{background:var(--acc);opacity:.9}
.btn-bad{color:var(--bad)}
.btn-sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:9px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--soft)}
.inp{width:100%;min-height:44px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea.inp{min-height:96px;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.pill-mute{background:var(--soft);color:var(--mute)}
.pill-acc{background:var(--acc-soft);color:var(--ink)}
.ibub{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibub-acc{background:var(--acc-soft);color:var(--acc)}.ibub-ok{background:var(--ok-soft);color:var(--ok)}.ibub-warn{background:var(--warn-soft);color:var(--warn)}.ibub-mute{background:var(--soft);color:var(--mute)}.ibub-bad{background:var(--bad-soft);color:var(--bad)}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dt-ok{background:var(--ok)}.dt-warn{background:var(--warn)}.dt-bad{background:var(--bad)}.dt-mute{background:var(--mute)}.dt-acc{background:var(--acc)}
.av{width:42px;height:42px;border-radius:999px;object-fit:cover;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute);flex:none;font-family:'Barlow Condensed',Barlow,sans-serif;font-size:17px;letter-spacing:.03em}
.av-l{width:76px;height:76px;font-size:28px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s ease}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.lrow:first-child{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--mute);padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.tbl td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.k{cursor:pointer}.tbl tr.k:hover td{background:var(--soft)}
.seg{display:inline-flex;background:var(--soft);padding:3px;border-radius:11px}
.seg button{min-height:36px;padding:0 13px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.25)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cg .h{color:var(--mute);font-size:11px;font-weight:700;text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.08em}
.cc{min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 4px;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.cc:hover{background:var(--soft)}
.cc-o{opacity:.4}
.cc-t .cn{background:var(--acc);color:var(--acc-ink)}
.cc-s{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cn{font-size:13px;font-weight:700;min-width:24px;height:24px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
@media(min-width:768px){.cc{min-height:112px;align-items:stretch;padding:8px}.cn{align-self:flex-start}}
.ch{font-size:12px;padding:3px 7px;border-radius:6px;background:var(--acc-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;border-left:2px solid var(--acc)}
.ch-Odrađeno{background:var(--ok-soft);color:var(--ok);border-left-color:var(--ok)}
.ch-Otkazano{background:var(--soft);color:var(--mute);text-decoration:line-through;border-left-color:var(--mute)}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
@media(min-width:768px){.sheet{max-width:600px;border-radius:18px;padding:24px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:70;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.nt{padding:12px;background:var(--soft);border-radius:12px;white-space:pre-wrap;word-break:break-word}
.today{background:linear-gradient(135deg,var(--acc-soft),var(--card) 60%);border-color:var(--acc-mid)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
<div class="mx-auto max-w-[1280px] px-4 md:px-8 h-16 flex items-center gap-6">
<button class="logo" onclick="go('dash')" aria-label="K-FIT početna">K<b>-</b>FIT</button>

</div>
</header>
<main id="main" class="mx-auto max-w-[1280px] px-4 md:px-8 pt-6 pb-28 md:pb-12"></main>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem('kfit'))}catch(e){}
S=S||{c:[],k:[],u:[],t:[],cat:[],log:[]};S.log=S.log||[];
const COLS={c:'clients',k:'packs',u:'pays',t:'trainings',cat:'catalog',log:'log'},NC=Object.keys(COLS).length;
let DBR=null,PREV={},LAST={},chain=Promise.resolve(),pending=0,DL=null;
function setSt(k){const e=$('#syncst');if(!e)return;const m={ok:['ok','Sinkronizirano'],busy:['warn','Spremam…'],local:['bad','Samo ovaj uređaj'],err:['bad','Greška spremanja'],load:['mute','Povezivanje…'],lock:['bad','Zaključano']}[k];e.innerHTML=`<i class="dt dt-${m[0]}"></i><span class="hidden sm:inline">${m[1]}</span>`}
async function diag(){const o=document.createElement('div');o.className='ov fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/60 md:p-4';
const L=['Prijavljen kao: '+((SESS&&SESS.user&&SESS.user.email)||'—'),'Baza: '+(DBR?'spojena':'nije spojena'),'Internet: '+(navigator.onLine?'da':'NE'),'Adresa: '+location.host];
o.innerHTML=`<div class="sheet"><h3 class="font-display text-2xl font-bold uppercase tracking-wide mb-3">Stanje sinkronizacije</h3><pre class="nt text-sm" style="white-space:pre-wrap">${esc(L.join('\n'))}</pre><div class="flex flex-wrap gap-2 mt-4"><button class="btn btn-acc" id="d1">Pokušaj ponovno</button><button class="btn" id="d2">Osvježi aplikaciju</button><button class="btn" id="d3">Odjava</button><span class="flex-1"></span><button class="btn" id="d4">Zatvori</button></div></div>`;document.body.append(o);
const q=()=>o.remove();o.querySelector('#d4').onclick=q;o.onclick=e=>{if(e.target==o)q()};
o.querySelector('#d1').onclick=async()=>{q();await initDb()};
o.querySelector('#d2').onclick=async()=>{try{for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}location.reload()};
o.querySelector('#d3').onclick=()=>{q();logout()}}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3800)}
function sync(){if(!DBR)return;pending++;setSt('busy');chain=chain.then(async()=>{for(const k in COLS){const col=DBR.collection(COLS[k]),p=PREV[k]||(PREV[k]=new Map()),cur=new Map((S[k]||[]).map(x=>[String(x.id),JSON.stringify(x)]));
for(const[id,j]of cur)if(p.get(id)!==j){await col.doc(id).set(JSON.parse(j));p.set(id,j)}
for(const id of[...p.keys()])if(!cur.has(id)){await col.doc(id).delete();p.delete(id)}}}).catch(e=>{console.error(e);setSt('err');toast(e&&e.code=='quota_exceeded'?'Baza je puna. Izvezi backup i obriši stare zapise.':'Spremanje nije uspjelo. Provjeri vezu i pokušaj ponovno.')}).finally(()=>{pending--;if(!pending){if($('#syncst span')?.textContent!='Greška spremanja')setSt('ok');applyRemote()}})}
function applyRemote(){if(!booted||pending||Object.keys(LAST).length<NC)return;if($('.ov')){setTimeout(applyRemote,1000);return}for(const k in COLS){S[k]=LAST[k];PREV[k]=new Map(LAST[k].map(x=>[String(x.id),JSON.stringify(x)]))}try{localStorage.setItem('kfit',JSON.stringify(S))}catch(e){}render()}
const save=()=>{try{localStorage.setItem('kfit',JSON.stringify(S))}catch(e){}sync()},uid=()=>Math.random().toString(36).slice(2,9);
/* katalog iz cjenika */
const CAT0=[];[[2,250,60],[6,700,180],[9,1000,270],[12,1300,360]].forEach(([m,p,d])=>CAT0.push({id:'on'+m,n:'Online coaching – '+m+' mj',p,t:0,d,ds:'Minimalno trajanje 2 mjeseca · '+(p/m).toFixed(1).replace('.',',')+' €/mj',a:1}));
[[2,8],[3,12],[4,16]].forEach(([w,pm])=>[[1,40],[3,37],[6,34],[12,30]].forEach(([m,r])=>CAT0.push({id:'in'+w+'_'+m,n:'Individualni '+w+'x tjedno – '+m+' mj',p:pm*m*r,t:pm*m,d:m*30,ds:pm+' treninga mjesečno · '+r+' €/trening',a:1})));
CAT0.push({id:'hib',n:'Hibridni paket (uživo + online)',p:0,t:0,d:30,ds:'Cijena još nije određena',a:0});
if((S.v||0)<3){S.cat=CAT0.concat((S.cat||[]).filter(x=>![1,2,3,4].includes(x.id)));S.v=3}
/* datumi i formati */
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)};
const today=()=>ds(new Date()),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)},daysTo=e=>Math.round((pd(e)-pd(today()))/864e5);
const fmt=d=>d?d.split('-').reverse().join('.'):'—',eur=n=>(+n||0).toLocaleString('hr-HR',{maximumFractionDigits:2})+' €',sum=a=>a.reduce((s,x)=>s+(+x.a||0),0);
const MOG=['siječnja','veljače','ožujka','travnja','svibnja','lipnja','srpnja','kolovoza','rujna','listopada','studenoga','prosinca'],MO=['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj','Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'],WD=['Pon','Uto','Sri','Čet','Pet','Sub','Ned'],WDL=['Nedjelja','Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak','Subota'];
/* poslovna logika */
const C=id=>S.c.find(c=>c.id==id),nm=c=>c?c.f+' '+c.l:'(obrisan klijent)',live=()=>S.c.filter(c=>!c.ar);
const used=k=>S.t.filter(t=>t.k==k.id&&t.s=='Odrađeno').length,left=k=>k.t?k.t-used(k):null;
const pst=k=>k.e<today()?'Istekao':(k.t&&left(k)<=0?'Iskorišten':'Aktivan');
const act=c=>c&&S.k.filter(k=>k.c==c.id&&pst(k)=='Aktivan').sort((a,b)=>b.e.localeCompare(a.e))[0],lastPk=c=>act(c)||S.k.filter(k=>k.c==c.id).sort((a,b)=>b.s.localeCompare(a.s))[0];
const lastPay=c=>S.u.filter(u=>u.c==c.id).sort((a,b)=>b.d.localeCompare(a.d))[0];
const paid=k=>sum(S.u.filter(u=>u.c==k.c&&(u.kid==k.id||(!u.kid&&u.pk&&u.pk==k.n)))),due=k=>Math.max(0,(+k.p||0)-paid(k));
function nextPay(c){const un=S.k.filter(k=>k.c==c.id&&due(k)>0).sort((a,b)=>a.b.localeCompare(b.b))[0];if(un)return{d:un.b||un.s,a:due(un),w:'Nije plaćeno: '+un.n,r:1};if(c.np)return{d:c.np,a:+c.npa||0,w:'Dogovorena uplata'};const k=lastPk(c);if(k&&c.st!='Neaktivan')return{d:k.e,a:k.p,w:'Obnova paketa'};return null}
function alerts(c){const r=[],k=lastPk(c);if(c.st=='Aktivan'&&k){if(pst(k)!='Aktivan')r.push(['r','Paket je '+(pst(k)=='Istekao'?'istekao':'iskorišten')+' – obnovi']);else{const l=left(k),d=daysTo(k.e);if(k.t&&l<=1)r.push(['r','Ostalo '+l+' '+(l==1?'trening':'treninga')]);else if(k.t&&l<=3)r.push(['y','Ostalo '+l+' treninga']);if(d<=7)r.push(['y',d==0?'Paket istječe danas':'Paket istječe za '+d+' d'])}}
if(c.st=='Aktivan'&&!k)r.push(['y','Nema paketa']);
S.k.filter(x=>x.c==c.id&&due(x)>0).forEach(x=>r.push([x.b&&daysTo(x.b)<0?'r':'y','Nije plaćeno '+eur(due(x))]));
if(c.np&&daysTo(c.np)<=3)r.push([daysTo(c.np)<0?'r':'y',(daysTo(c.np)<0?'Kasni uplata od ':'Uplata očekivana ')+fmt(c.np)]);return r}
const SEV={r:0,y:1,g:2},worst=a=>a.slice().sort((x,y)=>SEV[x[0]]-SEV[y[0]])[0];
function lvl(c){const a=alerts(c);if(a.length)return worst(a);const k=act(c);return k?['g','Aktivan paket']:null}
/* povijest promjena */
function logEv(cid,x){const m=today().slice(0,7);let d=S.log.find(l=>l.id==m);if(!d){d={id:m,e:[]};S.log.push(d)}d.e.push({ts:new Date().toISOString(),c:cid||'',x});if(d.e.length>1500)d.e=d.e.slice(-1500)}
const allLog=()=>S.log.flatMap(l=>l.e).sort((a,b)=>b.ts.localeCompare(a.ts));
/* UI pomoćnici */
const TN={g:'ok',y:'warn',r:'bad'},TS={Zakazano:'acc',Odrađeno:'ok',Otkazano:'mute'};
const icons=()=>{try{window.lucide&&lucide.createIcons()}catch(e){}};
const IC=(n,c='w-4 h-4')=>`<i data-lucide="${n}" class="${c}"></i>`;
const pill=(k,t)=>`<span class="pill pill-${k}">${t}</span>`;
const B=(cls,ic,txt,oc)=>`<button class="btn ${cls}" onclick="${oc}">${ic?IC(ic):''}<span>${txt}</span></button>`;
const hd=(t,sub,a)=>`<div class="flex flex-wrap items-end justify-between gap-3 mb-5"><div class="min-w-0"><h1 class="font-display text-3xl md:text-4xl font-bold tracking-tight uppercase">${t}</h1>${sub?`<p class="text-mute text-sm mt-0.5">${sub}</p>`:''}</div><div class="flex flex-wrap items-center gap-2">${a||''}</div></div>`;

function doImp(){if(!IMP)return;for(const k of['c','k','u','t','cat','log'])S[k]=Array.isArray(IMP[k])?IMP[k]:(k=='cat'?S.cat:[]);logEv('','Podaci vraćeni iz backupa');IMP=null;save();go('dash');toast('Podaci su vraćeni iz backupa.')}

${sec('Potrebna akcija','triangle-alert',li(need.slice(0,10),x=>`<div class="lrow"><span class="flex items-center gap-2 min-w-0"><i class="dt dt-${TN[worst(x.a)[0]]}"></i>${cl(x.c)}</span><span class="flex flex-wrap justify-end gap-1">${x.a.map(a=>pill(TN[a[0]],a[1])).join('')}</span></div>`,'Sve je pod kontrolom.')+(need.length>10?`<div class="text-xs text-mute pt-2">+${need.length-10} još</div>`:''))}
${sec('Preostali treninzi','dumbbell',li(L.filter(x=>x.k&&x.k.t).sort((a,b)=>left(a.k)-left(b.k)),x=>`<div class="lrow">${cl(x.c)}<div class="flex items-center gap-3 flex-none"><div class="bar w-20 hidden sm:block"><i class="${barCls(x.k)}" style="width:${Math.min(100,used(x.k)/x.k.t*100)}%"></i></div>${pill(left(x.k)<=1?'bad':left(x.k)<=3?'warn':'mute',left(x.k)+' / '+x.k.t)}</div></div>`,'Nema aktivnih paketa s brojem treninga.'))}
${sec('Uplate koje očekujem','banknote',li(exs,x=>`<div class="lrow"><div class="min-w-0">${cl(x.c)}<div class="text-xs text-mute truncate">${esc(x.n.w)}</div></div><span class="text-sm tnum flex-none text-right ${daysTo(x.n.d)<0?'text-[var(--bad)] font-semibold':'text-mute'}">${fmt(x.n.d)}<br><b class="text-ink">${eur(x.n.a)}</b></span></div>`,'Ništa u sljedećih 14 dana.'))}
${sec('Nadolazeći treninzi','calendar-clock',li(up,x=>`<div class="lrow">${cl(C(x.c)||{id:'',f:'?',l:''})}<span class="text-sm text-mute tnum flex-none">${WD[(pd(x.d).getDay()+6)%7]} ${fmt(x.d)} · ${x.tm}</span></div>`,'Nema zakazanih treninga.'),'',B('btn-sm','calendar-days','Kalendar',"go('cal')"))}
${sec('Zadnje uplate','receipt',li(recent,u=>`<div class="lrow">${cl(C(u.c)||{id:'',f:'?',l:''})}<span class="text-sm tnum flex-none"><span class="text-mute">${fmt(u.d)}</span> · <b>${eur(u.a)}</b></span></div>`,'Još nema uplata.'),'',B('btn-sm','wallet','Financije',"go('fin')"))}

const CFG={url:'https://jcxooxyrpahcwsvvzybo.supabase.co',key:'sb_publishable_FG7mdGIEQm_VkdBDayS9DA_fO59I82d'};
let SB=null,SESS=null;try{SB=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){console.error(e)}
/* sloj baze: ista sučelja (collection/doc/onSnapshot) preko Supabase tablice kdocs(col,id,data) */
function mkDb(){const T='kdocs',ref=(c,id)=>({
async get(){const{data,error}=await SB.from(T).select('data').eq('col',c).eq('id',String(id)).maybeSingle();if(error)throw error;return{exists:!!data,data:()=>data&&data.data}},
async set(o){const{error}=await SB.from(T).upsert({col:c,id:String(id),data:o,updated_at:new Date().toISOString()});if(error)throw error},
async delete(){const{error}=await SB.from(T).delete().eq('col',c).eq('id',String(id));if(error)throw error}});
return{doc:p=>{const i=p.indexOf('/');return ref(p.slice(0,i),p.slice(i+1))},
collection:c=>({doc:id=>ref(c,id),
onSnapshot(cb,eb){const M=new Map(),emit=()=>cb({docs:[...M.values()].map(d=>({data:()=>d}))});
const load=async()=>{const rows=[];for(let f=0;;f+=1000){const{data,error}=await SB.from(T).select('id,data').eq('col',c).order('id').range(f,f+999);if(error){eb&&eb(error);return}rows.push(...data);if(data.length<1000)break}M.clear();rows.forEach(r=>M.set(r.id,r.data));emit()};
let first=1;load();
SB.channel('kd-'+c).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'col=eq.'+c},p=>{if(p.eventType=='DELETE')M.delete(p.old.id);else M.set(p.new.id,p.new.data);emit()}).subscribe(st=>{if(st=='SUBSCRIBED'){if(first)first=0;else load()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('online',load)}})}}
const claude={use:async n=>n=='db'?(SB&&SESS?mkDb():null):n=='downloads'?{save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}}:null};

let seen={},booted=false,SUBD=false;
async function initDb(){if(DBR||LOCK)return;setSt('load');let db=null;try{db=await claude.use('db')}catch(e){}if(!DL){try{DL=await claude.use('downloads')}catch(e){}}

for(const k in COLS){PREV[k]=new Map(LAST[k].map(x=>[String(x.id),JSON.stringify(x)]));const ids=new Set(LAST[k].map(x=>String(x.id)));S[k]=LAST[k].concat(k=='cat'&&LAST.cat.length?[]:(S[k]||[]).filter(x=>!ids.has(String(x.id))))}
try{localStorage.setItem('kfit_m','1')}catch(e){}save();render();return}
for(const k in COLS)PREV[k]=new Map(LAST[k].map(x=>[String(x.id),JSON.stringify(x)]));
DBR=db;setSt('ok');try{localStorage.setItem('kfit_m','1')}catch(e){}try{await db.doc('meta/state').set({v:4})}catch(e){}
save();render()};
if(!SUBD){SUBD=true;for(const k in COLS)db.collection(COLS[k]).onSnapshot(snap=>{LAST[k]=snap.docs.map(d=>JSON.parse(JSON.stringify(d.data())));seen[k]=1;if(Object.keys(seen).length==NC){if(!booted)boot();else applyRemote()}},e=>{console.error(e);if(e&&e.code=='revoked'){setSt('err')}})}}
